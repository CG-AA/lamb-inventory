[defaults]
# Relative paths here resolve against THIS file's directory, so plays in
# playbooks/ still find the root inventory and roles/. ansible.cfg itself is
# only read from the CWD though — run from the repo root (the Makefile
# targets guarantee that): `make run`, or `ansible-playbook playbooks/site.yml`.
inventory = inventory.yaml
roles_path = roles

[privilege_escalation]
# Every play here touches root-owned things (apt, /etc/default/locale, GRUB,
# the initramfs), and with no become password supplied ansible escalates with
# `sudo -n` — which a normal workstation login cannot satisfy: it dies on the
# first become task with "sudo: interactive authentication is required".
# Prompt for the password once per run instead. --syntax-check, --list-tasks
# and --list-hosts are exempt (ansible skips the prompt for them), so `make
# syntax` and CI stay non-interactive. Where the login has passwordless sudo,
# the prompt takes an empty answer — or set ANSIBLE_BECOME_ASK_PASS=False.
become_ask_pass = True

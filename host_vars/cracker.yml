---
# Machine-specific values for `cracker` (Lenovo ThinkBook 14 G6 IRL, 21KG).
# Anything here is true of this laptop only — role defaults stay host-agnostic
# so the same playbook runs unchanged on a VM or container.

# eDP-1 native resolution. The role default is "auto", which lets GRUB pick the
# best mode on hardware we know nothing about.
grub_gfxmode: "1920x1200"

# This laptop gets the Bad Apple!! kitty animation (26 MB of frames synced to
# ~/.badapple). The role default is false, so a VM, container or server gets
# plain zsh + starship and the hook/prompt segment quietly no-op.
zsh_badapple: true

---
- name: Lamb base
  # Every host in the inventory. `development` is a PROFILE group now (see
  # inventory.yaml), not the parent of everything — targeting it here would
  # silently stop provisioning the first host that isn't a dev box.
  hosts: all
  gather_facts: true      # needed for ansible_user_dir (home of the target user)
  # Contracts (full text in CLAUDE.md — read it before adding a role):
  #   * every role carries `<role>_manage` and is gated on it HERE, so a class
  #     or profile group can switch it without touching its tasks. Baseline
  #     roles default true (a class opts out); profile-only roles default false
  #     (a profile opts in);
  #   * host detection happens ONLY in roles/facts, which must stay first and
  #     tagged `always` so a sliced run (--tags kitty) still has its vars.
  # Every role also carries its own tag; the boot trio shares `boot`. Re-run a
  # slice with e.g. `ansible-playbook playbook.yaml --tags boot` (or --tags kitty).
  roles:
    # Probes this machine once: kitty_has_de, lamb_has_plasma, grub_applicable,
    # plymouth_applicable. Detection only — this role never changes anything.
    - role: facts
      tags: [always]
    # UTF-8 base: generated locales + LANG, drops the blanket LC_ALL
    - role: locale
      when: locale_manage | bool
      tags: [locale]
    # JetBrainsMono Nerd Font + monospace wiring (fontconfig/Plasma)
    - role: fonts
      when: fonts_manage | bool
      tags: [fonts]
    - role: kitty
      when: kitty_manage | bool
      tags: [kitty]
    - role: nvim
      when: nvim_manage | bool
      tags: [nvim]
    # identity + init.defaultBranch in the user's global git config
    - role: git
      when: git_manage | bool
      tags: [git]
    # boot appearance: cmdline (no splash), hidden menu, background
    - role: grub
      when: grub_manage | bool
      tags: [grub, boot]
    # splash off via text theme (package kept for the LUKS prompt)
    - role: plymouth
      when: plymouth_manage | bool
      tags: [plymouth, boot]
    # Lenovo LBLDESP scaffold — DMI-gated, firmware write deferred
    - role: bootlogo
      when: bootlogo_manage | bool
      tags: [bootlogo, boot]
    # zsh + plugins + starship prompt and the shared shell dotfiles; the 26 MB
    # bad-apple frame set only lands where zsh_badapple is true (cosmetics)
    - role: zsh
      when: zsh_manage | bool
      tags: [zsh]
    # ---- development profile ------------------------------------------------
    # Defaults false, switched on by group_vars/development.yml, so
    # `--tags development` re-runs the dev-only roles. Node + npm plus the
    # user-global CLIs that land in ~/.local/bin.
    #
    # After zsh because zsh owns the PATH those global bins land on. Ordering
    # against nvim does NOT matter today — lazy.nvim runs a plugin's `build`
    # when you start nvim, not when Ansible deploys init.lua. If a
    # `nvim --headless "+Lazy! sync" +qa` task is ever added to roles/nvim,
    # this role has to move ABOVE it: yarn must exist before that build runs.
    - role: npm
      when: npm_manage | bool
      tags: [npm, development]
    # ---- robotics profile ---------------------------------------------------
    # Both default to false and are switched on by group_vars/robotics.yml, so
    # `--tags robotics` re-runs the pair. Scaffolds for now: the tasks are empty
    # and the roles no-op until they are written.
    - role: ros2-lyrical
      when: ros2_lyrical_manage | bool
      tags: [ros2, robotics]
    - role: gazebo
      when: gazebo_manage | bool
      tags: [gazebo, robotics]
    # add more roles here as you modularise the rest of your setup, e.g.:
    # - dialout   # the `usermod -aG dialout` note in tmp.txt

---
# ---- Why this role has no variables ----------------------------------------
# magic-wormhole is a single binary with no configuration file of its own: the
# only knobs it exposes (--appid, --relay-url, --transit-helper) are per-
# invocation flags on the command line, and the CLI writes no dotfile to
# override. There is therefore nothing for a template or a *_config_dir var to
# own — the role's whole job is "the package is present".
#
# If you ever need a non-default rendezvous or transit relay, that is an alias
# in roles/zsh/files/shell_common (where the shell-agnostic aliases live), not
# a var here — the flags belong to the call, not to the install.

# ---- Command vs package name -----------------------------------------------
# The role is named after the command (`wormhole`), the apt package is
# `magic-wormhole` — same split as the nvim role (command nvim, package
# neovim). Anything referring to this role's tag or vars uses `wormhole`.

# ---- Known gap: no zsh completion ------------------------------------------
# The receiving side offers tab-completion on the code words, but the Debian
# package ships that completion for bash only
# (/usr/share/bash-completion/completions/wormhole). The .zshrc deployed by
# roles/zsh runs plain `compinit`, so under zsh `wormhole receive <TAB>` does
# nothing. Bridging it is a one-line shell change, deliberately NOT made here
# because it belongs to the shell role, not this one:
#   autoload -Uz bashcompinit && bashcompinit
# Typing the code by hand works exactly the same; the words are chosen to be
# phonetically distinct precisely so they can be dictated and typed.

# Full revert: `sudo apt purge magic-wormhole`. The tool keeps no state between
# runs — codes are single-use and nothing is left in the user's home.

---
- name: Install neovim
  become: true
  ansible.builtin.apt:
    name: neovim
    state: present
    # cache refreshed once per run by the common dependency

# alternatives interrogates the real binary, so under --check on a host where
# neovim isn't installed yet (the install above only pretended) it hard-fails
# instead of reporting "would change". Probe first; skip only that dry-run gap.
- name: Check whether the nvim binary is present
  ansible.builtin.stat:
    path: /usr/bin/nvim
  register: _nvim_bin

- name: Make neovim the default editor
  become: true
  community.general.alternatives:
    name: "{{ item }}"
    link: "/usr/bin/{{ item }}"
    path: /usr/bin/nvim
    priority: 60          # > nano (40); `path` also forces manual selection
  loop: "{{ nvim_alternatives }}"
  when:
    - nvim_set_default | bool
    - not ansible_check_mode or _nvim_bin.stat.exists

- name: Ensure nvim config directory exists
  become: false          # this is *your* dotfile, never root's
  ansible.builtin.file:
    path: "{{ nvim_config_dir }}"
    state: directory
    mode: "0755"

- name: Deploy init.lua from the role (source of truth)
  become: false
  ansible.builtin.template:
    src: init.lua.j2
    dest: "{{ nvim_config_dir }}/init.lua"
    mode: "0644"
    backup: true         # keeps the previous file on first run, so nothing is lost

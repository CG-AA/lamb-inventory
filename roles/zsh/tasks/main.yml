---
- name: Install zsh and its prompt plugins
  become: true
  ansible.builtin.apt:
    name:
      - zsh
      - zsh-autosuggestions        # /usr/share/zsh-autosuggestions/... sourced by .zshrc
      - zsh-syntax-highlighting    # /usr/share/zsh-syntax-highlighting/... sourced LAST
    state: present
    # cache refreshed once per run by the common dependency

# starship is missing from older Debian stable, so ask apt before installing
# rather than failing the run on a host that simply cannot have it.
- name: Check whether apt knows about starship
  ansible.builtin.command: apt-cache policy starship
  register: _zsh_starship_policy
  changed_when: false
  check_mode: false
  when: zsh_install_starship | bool

# Two ways apt can say no: a known-but-uninstallable package prints
# "Candidate: (none)", a completely unknown one prints NOTHING at all —
# an empty stdout must not slip past the guard and crash the install.
- name: Install the starship prompt
  become: true
  ansible.builtin.apt:
    name: starship
    state: present
  when:
    - zsh_install_starship | bool
    - _zsh_starship_policy.stdout is defined
    - "'Candidate:' in _zsh_starship_policy.stdout"
    - "'Candidate: (none)' not in _zsh_starship_policy.stdout"

- name: Warn that starship is not packaged on this host
  ansible.builtin.debug:
    msg: >-
      apt has no starship package here (older Debian stable does not ship one)
      — zsh falls back to its plain default prompt, and the bad-apple segment
      has nowhere to render. The deployed .zshrc guards the init call, so shell
      startup stays clean. Install starship by hand, or set
      zsh_install_starship: false to silence this.
  when:
    - zsh_install_starship | bool
    - _zsh_starship_policy.stdout is defined
    - >-
      'Candidate:' not in _zsh_starship_policy.stdout
      or 'Candidate: (none)' in _zsh_starship_policy.stdout

- name: Make zsh the login shell for {{ zsh_login_user }}
  become: true
  ansible.builtin.user:
    name: "{{ zsh_login_user }}"
    shell: "{{ zsh_shell_path }}"
  when: zsh_set_default_shell | bool

# ---- The -lamb contract ----------------------------------------------------
# Every rc file this role owns ends in `-lamb` and is REPLACED wholesale on
# each run. The user's real ~/.zshrc and ~/.bashrc are NOT owned here: each
# only gets a marker-delimited block (below) sourcing its -lamb counterpart.
# So whatever random installers append lands in the stock files — outside the
# managed ones — where it is easy to spot and never fought over.
- name: Deploy the managed shell dotfiles from the role (source of truth)
  become: false          # these are *your* dotfiles, never root's
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ zsh_home }}/.{{ item }}"
    mode: "0644"
  loop:
    - shellrc-lamb       # POSIX layer for both shells: PATH, aliases, functions
    - zshrc-lamb         # zsh interactive config
    - bashrc-lamb        # bash-only additions (pyenv flavour, completion)
    - zshbadapple-lamb   # self-guarding: no-ops without frames
  loop_control:
    label: ".{{ item }}"

# One-time migration: before the -lamb model, this role deployed ~/.zshrc
# itself. Sourcing .zshrc-lamb on top of that old copy would run everything
# twice, so a ~/.zshrc that is EXACTLY the old shipped file (checksum match —
# a hand-customized one is never touched) is reset to a comment stub first.
- name: Check what ~/.zshrc currently is
  become: false
  ansible.builtin.stat:
    path: "{{ zsh_home }}/.zshrc"
    checksum_algorithm: sha256
  register: _zsh_zshrc_now

- name: Reset the old role-shipped ~/.zshrc to a stub
  become: false
  ansible.builtin.copy:
    content: |
      # ~/.zshrc — yours. The managed zsh config lives in ~/.zshrc-lamb,
      # pulled in by the lamb-inventory block below (keep that block last).
    dest: "{{ zsh_home }}/.zshrc"
    mode: "0644"
  when:
    - _zsh_zshrc_now.stat.exists
    - _zsh_zshrc_now.stat.checksum | default('') in zsh_legacy_zshrc_checksums

# create: true covers a fresh host with no rc file at all. The block sits at
# the file's END and must stay last (zsh-syntax-highlighting's requirement);
# things appended after it belong above it — move them up when they appear.
- name: Source the managed config from the user's own rc files
  become: false
  ansible.builtin.blockinfile:
    path: "{{ zsh_home }}/{{ item.rc }}"
    create: true
    mode: "0644"
    backup: true         # keeps the pre-block file on first run, so nothing is lost
    marker: "# {mark} lamb-inventory (roles/zsh)"
    block: '[ -f ~/{{ item.managed }} ] && . ~/{{ item.managed }}'
  loop:
    - {rc: .zshrc, managed: .zshrc-lamb}
    - {rc: .bashrc, managed: .bashrc-lamb}
  loop_control:
    label: "{{ item.rc }}"

# Files earlier revisions of this role deployed under other names. Mirrors the
# grub_legacy_dropins pattern: absorbed, so retired.
- name: Retire superseded dotfiles
  become: false
  ansible.builtin.file:
    path: "{{ zsh_home }}/{{ item }}"
    state: absent
  loop: "{{ zsh_legacy_dotfiles }}"

- name: Ensure the user config directory exists
  become: false
  ansible.builtin.file:
    path: "{{ zsh_home }}/.config"
    state: directory
    mode: "0755"

# Deployed even when starship was skipped above: the file is inert without the
# binary and becomes correct the moment starship appears.
- name: Deploy starship.toml from the role (source of truth)
  become: false
  ansible.builtin.copy:
    src: starship.toml
    dest: "{{ zsh_home }}/.config/starship.toml"
    mode: "0644"
    backup: true

- name: Deploy the Bad Apple frame set
  when: zsh_badapple | bool
  become: false
  block:
    - name: Ensure the badapple directory exists
      ansible.builtin.file:
        path: "{{ zsh_badapple_dir }}"
        state: directory
        mode: "0755"

    # The 6524 frames travel as ONE tarball, not loose files: copy's checksum
    # compare on a single archive is the whole idempotency story (re-runs cost
    # one hash, no rsync dependency, no per-frame diff). The tarball stays on
    # disk afterwards as the deployed-version marker.
    - name: Copy the frame archive into the user's home
      ansible.builtin.copy:
        src: badapple-esc.tar.gz
        dest: "{{ zsh_badapple_dir }}/badapple-esc.tar.gz"
        mode: "0644"
      register: _zsh_frames

    # Clean swap on change: esc/ is wholly role-owned (the mutable .n lives in
    # the parent directory), so dropping the old tree before unpacking gives
    # the same stale-file guarantee `synchronize: delete=true` used to.
    # noqa below: not handlers on purpose — the swap must happen HERE, between
    # the archive landing and anything reading esc/, not at end of play.
    - name: Remove the previous frame tree  # noqa: no-handler
      ansible.builtin.file:
        path: "{{ zsh_badapple_dir }}/esc"
        state: absent
      when: _zsh_frames is changed

    # Skipped under --check for the same reason as the font extract
    # (roles/fonts/tasks/main.yml): neither the directory nor the tarball
    # exist there — the tasks above only pretend — and unarchive hard-fails
    # on a missing dest instead of reporting "would change". The copy above
    # already accounts for the frame set in the dry run's change count.
    - name: Unpack the frames  # noqa: no-handler
      ansible.builtin.unarchive:
        src: "{{ zsh_badapple_dir }}/badapple-esc.tar.gz"
        dest: "{{ zsh_badapple_dir }}"
        remote_src: true
      when:
        - _zsh_frames is changed
        - not ansible_check_mode

    # .n is runtime state, rewritten by the precmd hook on every prompt.
    # force: false = create if absent, then never touch it again.
    - name: Initialise the frame counter
      ansible.builtin.copy:
        content: "0\n"
        dest: "{{ zsh_badapple_dir }}/.n"
        mode: "0644"
        force: false

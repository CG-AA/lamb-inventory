---
# ---- Behaviour toggles ---------------------------------------------------
# Point the connecting user's passwd entry at zsh. Takes effect on the next
# login (running shells are unaffected). Set false to install and configure
# zsh without making it the default -- `zsh` still starts it by hand.
zsh_set_default_shell: true

# starship is packaged in Ubuntu 24.04+ universe and Debian trixie, but NOT in
# older stable (bookworm). The role probes apt first: it installs the package
# where it exists and warns-and-skips where it does not -- never fails. The
# deployed .zshrc guards the `starship init` eval with `command -v starship`,
# so a starship-less host still gets a clean zsh with the plain default prompt.
zsh_install_starship: true

# Bad Apple!! identity segment: 6524 kitty-graphics frames (shipped as one
# ~3.7 MB tarball, ~26 MB unpacked) rendered into the prompt by a precmd hook.
# Default OFF -- it is a per-machine easter egg, not base shell config; forced
# true in host_vars/cracker.yml.
#
# The hook file (~/.zshbadapple) deploys everywhere regardless, because it
# self-guards: it no-ops outside kitty, over SSH, and when ~/.badapple/esc is
# absent. This var gates only the frame payload.
#
# Turning it back off does NOT remove already-deployed frames -- the role never
# deletes them. Revert by hand with `rm -rf ~/.badapple`.
zsh_badapple: false

# ---- Paths ---------------------------------------------------------------
# Debian's canonical zsh path (usr-merge also provides /bin/zsh).
zsh_shell_path: /usr/bin/zsh

# Derived from the common role's target-user contract — override
# common_target_home/common_target_user once (host_vars) to retarget every
# per-user role, or set these two alone for a zsh-only override.
zsh_home: "{{ common_target_home }}"
zsh_login_user: "{{ common_target_user }}"

# Frame set + counter live here. ~/.badapple/.n is RUNTIME STATE: the precmd
# hook rewrites it on every prompt. The role creates it once (force: false) and
# never touches it again; only the tarball + esc/ are role-owned.
zsh_badapple_dir: "{{ zsh_home }}/.badapple"

# The five dotfiles are deployed verbatim from files/ (ansible.builtin.copy).
# Those copies are the single source of truth; edit them to change the shell.

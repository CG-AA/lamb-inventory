---
argument_specs:
  main:
    short_description: Generated locales and LANG via update-locale
    options:
      locale_generate:
        type: list
        elements: str
        default: [en_US.UTF-8, zh_TW.UTF-8]
        description: Locales ensured present via locale-gen; first is the default.
      locale_lang:
        type: str
        default: en_US.UTF-8
        description: System default LANG written with update-locale.
      locale_remove_lc_all:
        type: bool
        default: true
        description: >-
          Drop the installer's blanket LC_ALL (it overrides every LC_*
          category and defeats per-category tailoring).

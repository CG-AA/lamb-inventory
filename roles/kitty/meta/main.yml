---
galaxy_info:
  role_name: kitty
  author: TheLamb
  description: kitty terminal — full desktop setup, or terminfo-only on headless hosts
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Debian
      versions:
        - all
  galaxy_tags: []

# tags: [always] is load-bearing: duplicate dependencies dedupe to the FIRST
# compiled instance, which inherits only that parent's tags — without the
# explicit always-tag, common would vanish from --tags <role> runs.
dependencies:
  - role: common
    tags: [always]

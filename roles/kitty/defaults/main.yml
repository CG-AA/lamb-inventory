---
# ---- Behaviour toggles ---------------------------------------------------
# kitty_has_de is auto-detected (systemd graphical.target / display manager).
# Leave it unset for autodetect, or force it per-host in inventory/host_vars:
#   kitty_has_de: true    # treat as desktop -> full kitty
#   kitty_has_de: false   # treat as headless -> terminfo only

kitty_set_default: true          # register kitty as x-terminal-emulator and select it

# Plasma-only: actively displace Konsole in favour of kitty --
#   * drop the Konsole taskbar pin
#   * disable Konsole's built-in Ctrl+Alt+T launch shortcut
#   * bind kitty to `kitty_launch_shortcut` instead
# Only applies on KDE Plasma hosts, and (like all shortcut/panel changes) only
# takes effect on the user's next login. Set false to leave Konsole alone.
kitty_replace_konsole: true
kitty_launch_shortcut: "Meta+Return"   # global hotkey to launch kitty

# Where kitty reads its config. Derived from the common role's target-user
# contract — override common_target_home once (host_vars) to retarget every
# per-user role, or set this var alone for a kitty-only override.
kitty_config_dir: "{{ common_target_home }}/.config/kitty"

# The terminal font. Follows the shared monospace family (group_vars/all.yml)
# that the fonts role installs; the default() keeps the role runnable
# standalone, outside this inventory.
kitty_font_family: "{{ font_mono_family | default('JetBrainsMono Nerd Font') }}"

# kitty.conf renders from templates/kitty.conf.j2 — the single source of
# truth; edit the template (or the vars above) to change kitty settings.

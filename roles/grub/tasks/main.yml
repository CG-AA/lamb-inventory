---
# ---- Applicability gate ----------------------------------------------------
# grub_applicable is detected once in roles/facts (update-grub + /boot/grub) —
# do NOT re-probe here (CLAUDE.md). GRUB is absent on containers, cloud images
# booted by their host, and systemd-boot machines; there the role warns and
# skips, never fails.
- name: Warn that GRUB is not configurable here
  ansible.builtin.debug:
    msg: >-
      GRUB not usable on this host (update-grub or /boot/grub missing) —
      grub role skipped, boot appearance not applied. Force with
      grub_applicable: true in inventory/host_vars if this is wrong.
  when: grub_manage | bool and not grub_applicable | bool

# grub_manage is also gated at the play level (playbook.yaml); kept here as
# defence in depth. NOTE the role still depends on roles/facts for
# grub_applicable — included directly it would warn-and-skip (see CLAUDE.md).
- name: Configure the GRUB boot appearance
  when: grub_manage | bool and grub_applicable | bool
  block:
    # No grub package ships /etc/default/grub.d — grub-mkconfig sources it only
    # if it exists (on hosts with kdump-tools a package created it already).
    # Ours is the drop-in that needs it, so ours creates it.
    - name: Ensure the GRUB drop-in directory exists
      become: true
      ansible.builtin.file:
        path: "{{ grub_dropin_path | dirname }}"
        state: directory
        mode: "0755"

    # The role ships without a real background image; probe whether the user has
    # dropped one into roles/grub/files/ and degrade gracefully when they haven't
    # (the drop-in then simply omits GRUB_BACKGROUND).
    - name: Check whether the role ships a background image
      delegate_to: localhost
      become: false
      ansible.builtin.stat:
        path: "{{ role_path }}/files/{{ grub_background_src }}"
      register: _grub_bg_src
      when: grub_background_enabled | bool

    - name: Decide whether the background can be configured
      ansible.builtin.set_fact:
        _grub_background_ready: >-
          {{ grub_background_enabled | bool
             and (_grub_bg_src.stat.exists | default(false)) }}

    - name: Note the missing background image (drop one into roles/grub/files/)
      ansible.builtin.debug:
        msg: >-
          No {{ grub_background_src }} in roles/grub/files/ — the drop-in will omit
          GRUB_BACKGROUND until you add one (PNG/JPEG/TGA, sized to grub_gfxmode).
      when: grub_background_enabled | bool and not _grub_background_ready

    - name: Deploy the GRUB menu background image
      become: true
      ansible.builtin.copy:
        src: "{{ grub_background_src }}"
        dest: "{{ grub_background_dest }}"
        mode: "0644"
      when: _grub_background_ready
      notify: Update GRUB

    - name: Deploy the boot-appearance GRUB drop-in
      become: true
      ansible.builtin.template:
        src: 95-boot-appearance.cfg.j2
        dest: "{{ grub_dropin_path }}"
        mode: "0644"
      notify: Update GRUB

    # These were manual one-offs from the GPT/ESP migration; their settings now
    # live in the drop-in above (and would otherwise override it, sorting later).
    - name: Retire absorbed legacy drop-ins
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ grub_legacy_dropins }}"
      notify: Update GRUB

    # ---- Composition guard --------------------------------------------------
    # /etc/default/grub.d/ is a shared namespace: lamb-machine writes 90-, the
    # kdump-tools package writes its own, we write 95-. grub-mkconfig sources
    # them in glob order, so a plain assignment in a later file silently deletes
    # what an earlier one contributed — which is exactly how this role ate
    # 90-lamb-machine.cfg's resume= (hibernation) on glowing-glass.
    #
    # Source the same files grub-mkconfig does, twice: once WITHOUT our drop-in
    # (the baseline other tools asked for) and once WITH it (what will be
    # generated). Every baseline token we did not deliberately claim in
    # grub_cmdline_remove must survive. Fails the run loudly if it doesn't —
    # this catches the next tool to land in that directory too, not just ours.
    - name: Verify the drop-in preserves what other grub.d files contributed
      become: true
      changed_when: false
      when: not ansible_check_mode      # the template above is not on disk under --check
      ansible.builtin.shell:
        executable: /bin/sh
        cmd: |
          dir='{{ grub_dropin_path | dirname }}'
          ours='{{ grub_dropin_path }}'
          owned=' {{ grub_cmdline_remove | join(" ") }} '

          # Mirror grub-mkconfig: /etc/default/grub first, then grub.d/*.cfg in
          # glob order, in a subshell so the sourcing cannot leak out.
          #   $1 = "skip" to leave our own drop-in out, anything else to include it
          #   $2 = name of the variable to report back
          collect() {
            (
              if [ -r /etc/default/grub ]; then . /etc/default/grub; fi
              for f in "$dir"/*.cfg; do
                if [ ! -r "$f" ]; then continue; fi
                if [ "$1" = skip ] && [ "$f" = "$ours" ]; then continue; fi
                . "$f"
              done
              eval "printf '%s\n' \"\$$2\""
            )
          }

          rc=0
          for var in GRUB_CMDLINE_LINUX_DEFAULT GRUB_CMDLINE_LINUX; do
            base=$(collect skip "$var")
            final=$(collect all "$var")
            for tok in $base; do
              case "$owned" in *" $tok "*) continue ;; esac      # ours to control
              case " $final " in
                *" $tok "*) ;;
                *) echo "CLOBBER: $ours drops '$tok' from $var"; rc=1 ;;
              esac
            done
          done
          if [ "$rc" = 0 ]; then echo "OK: no inherited tokens lost"; fi
          exit "$rc"
